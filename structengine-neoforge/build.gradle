plugins {
    id 'net.neoforged.gradle.userdev' version "${neogradle_version}"
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

base {
    archivesName = 'structengine-neoforge'
}

// NeoGradle 需要显式声明工具链（用于 jar-in-jar 与 Java 执行环境）
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // 核心逻辑下沉到 common
    implementation project(':structengine-common')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

// NeoForge 模组 jar 需要随包携带 common 的核心逻辑类
tasks.named('jar', Jar) {
    from project(':structengine-common').sourceSets.main.output
}

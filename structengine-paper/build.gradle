plugins {
    id 'java'
}

repositories {
    maven {
        name = 'PaperMC'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

base {
    archivesName = 'structengine-paper'
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paper_version}"
    implementation project(':structengine-common')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') {
        expand 'version': project.version
    }
}

// Paper 插件需要自带 common 的逻辑类（Gson / Paper API 由服务端提供）
tasks.named('jar', Jar) {
    from project(':structengine-common').sourceSets.main.output
}

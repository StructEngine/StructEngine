# Build environment
# 默认使用系统 JAVA_HOME（需为 JDK 21）。若 JAVA_HOME 未指向 JDK 21，
# 可取消下一行注释并填写本机 JDK 21 路径，或命令行传入 -Dorg.gradle.java.home=<路径>
# org.gradle.java.home=/path/to/jdk-21
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft / Fabric versions
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11

# Mod metadata
mod_version=1.0.0
maven_group=com.structengine
archives_base_name=structengine
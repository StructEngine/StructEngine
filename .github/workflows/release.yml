name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -Dorg.gradle.java.home=$JAVA_HOME

      - name: Stage platform jars
        run: |
          mkdir -p staging
          cp structengine-fabric/build/libs/structengine-fabric-*.jar staging/
          cp structengine-neoforge/build/libs/structengine-neoforge-*.jar staging/
          cp structengine-paper/build/libs/structengine-paper-*.jar staging/
          rm -f staging/*-sources.jar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            staging/*.jar